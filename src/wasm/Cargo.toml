[package]
name = "agentic-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Agentic Language Team"]
description = "WASM-based compiler for Agentic programming language"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# wasm-opt optimization
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-simd"]
